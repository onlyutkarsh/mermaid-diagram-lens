version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels:
      - "dependencies"
    reviewers:
      - "onlyutkarsh"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "@types/vscode"
